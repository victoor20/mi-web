# Auditoría Lighthouse de las páginas principales sobre la web compilada.
# Se ejecuta en la rama del rediseño, en pull requests a main y a mano. No publica nada:
# los informes quedan como artefacto descargable del run (pestaña Actions > run > Artifacts).
name: Lighthouse

on:
  push:
    branches: [rediseno]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15 autorun
      - if: always()
        run: node scripts/lhci-report.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
